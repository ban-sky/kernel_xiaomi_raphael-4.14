name: build-raphael-4.14

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  KNAME: Zundamon
  KVERNUM: "1.0"
  KSTAGE: "rc4"
  KV: "v1.0-rc4"
  KLINE: "4.14.357"
  # The tree is backslashxx/KernelSU v3.3.1 (KSU_VERSION 32680,
  # KSU_APP_PROFILE_VER 4, package me.weishu.kernelsu). Its own build 32680 is
  # the exact match: MINIMAL_SUPPORTED_KERNEL 32513 <= 32680, profile ABI v4.
  # KernelSU-Next 3.1.0/3.2.0/3.4.x mismatch (profile ABI v2/v3/v4 + version gates).
  KSU_MANAGER_URL: "https://github.com/backslashxx/KernelSU/releases/download/v3.3.1/KernelSU_v3.3.1_32680-release.apk"
  KSU_MANAGER_ASSET: "KernelSU-v3.3.1_32680.apk"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        variant: [standard, docker]
    name: build-${{ matrix.variant }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libyaml-dev device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi make zip unzip curl

      - name: Show toolchain versions
        run: aarch64-linux-gnu-gcc --version | head -1

      - name: Configure (${{ matrix.variant }})
        run: |
          set -o pipefail
          mkdir -p out
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            NO_YAML=1 \
            DTC_EXT=dtc \
            raphael_defconfig 2>&1 | tee out.configure.log \
            || { echo "CONFIGURE FAILED"; exit 1; }
          if [ "${{ matrix.variant }}" = "docker" ]; then
            scripts/kconfig/merge_config.sh -m -O out out/.config arch/arm64/configs/raphael_docker.config
            make -j"$(nproc)" O=out ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
              NO_YAML=1 \
              DTC_EXT=dtc \
              olddefconfig 2>&1 | tee -a out.configure.log \
              || { echo "DOCKER CONFIG MERGE FAILED"; exit 1; }
          fi
          grep -E "CONFIG_(UTS_NS|PID_NS|NET_NS|USER_NS|CGROUP_PIDS|VETH|SECCOMP_FILTER)=" out/.config || true

      - name: Build Image and dtbs
        run: |
          set -o pipefail
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            NO_YAML=1 \
            DTC_EXT=dtc \
            Image dtbs 2>&1 | tee out.build.log \
            || { echo "BUILD FAILED"; exit 1; }

      - name: Build dtbo.img
        run: |
          make -j"$(nproc)" O=out ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            NO_YAML=1 \
            DTC_EXT=dtc \
            arch/arm64/boot/dts/qcom/dtbo.img || true
          ls -l out/arch/arm64/boot/dts/qcom/dtbo.img || echo "no dtbo.img"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp out/arch/arm64/boot/Image artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/Image.gz artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtb artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/*.dtbo artifacts/ 2>/dev/null || true
          cp out/arch/arm64/boot/dts/qcom/dtbo.img artifacts/ 2>/dev/null || true
          cp out/.config "artifacts/config-raphael-${{ matrix.variant }}" 2>/dev/null || true
          cp out/include/config/kernel.release artifacts/ 2>/dev/null || true
          cp out.build.log out.configure.log artifacts/ 2>/dev/null || true
          ls -lh artifacts

      - name: Fetch KernelSU manager (backslashxx v3.3.1, build 32680)
        if: success()
        continue-on-error: true
        run: |
          curl -fsSL -o KernelSU.apk "$KSU_MANAGER_URL"
          ls -lh *.apk 2>/dev/null || true

      - name: Package AnyKernel3 flashable zip
        if: success()
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          KREL=$(cat out/include/config/kernel.release)
          KVER=${KREL%%-*}
          SUFFIX=""
          [ "$VARIANT" = "docker" ] && SUFFIX="-docker"
          ZIPNAME="${KNAME}-${KVER}-${KV}${SUFFIX}.zip"
          echo "ZIPNAME=$ZIPNAME" >> "$GITHUB_ENV"

          curl -fsSL -o ak3.zip https://github.com/osm0sis/AnyKernel3/archive/refs/heads/master.zip
          unzip -q ak3.zip
          mv AnyKernel3-master ak3

          cat > ak3/anykernel.sh <<EOF
          properties() { '
          kernel.string=${KNAME}-${KVER}-${KV}${SUFFIX} for Redmi K20 Pro (raphael), uname: ${KREL}
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          device.name1=raphael
          device.name2=cepheus
          supported.versions=
          supported.patchlevels=
          '; }

          BLOCK=/dev/block/bootdevice/by-name/boot;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          EOF

          cat >> ak3/anykernel.sh <<'AKEOF'

          # Zundamon: leave the matching KernelSU manager (backslashxx v3.3.1,
          # build 32680) on the sdcard so it can be installed after first boot.
          if [ -f "$AKHOME/KernelSU.apk" ]; then
            ui_print " ";
            ui_print "Copying KernelSU manager (v3.3.1_32680)";
            mkdir -p /sdcard/Download/Zundamon;
            cp -f "$AKHOME/KernelSU.apk" /sdcard/Download/Zundamon/KernelSU.apk;
            ui_print "  -> /sdcard/Download/Zundamon/KernelSU.apk";
            ui_print "  Install it after boot to manage root.";
          fi

          write_boot;
          AKEOF

          cp out/arch/arm64/boot/Image ak3/Image
          if [ -f KernelSU.apk ]; then
            cp KernelSU.apk ak3/KernelSU.apk
          fi
          # 刻意不打包 dtbo.img：boot 里的 dtb 与 ROM 的 dtbo 必须同代，覆盖 ROM 的 dtbo 反而可能开不了机。
          # 需要单独处理 dtbo 的用户从 artifact raphael-*-image 里取 dtbo.img。
          (cd ak3 && zip -r9 "../${ZIPNAME}" . -x '*.git*')
          sha256sum "${ZIPNAME}" > "${ZIPNAME}.sha256"
          ls -lh "${ZIPNAME}" "${ZIPNAME}.sha256"

      - name: Verify flashable zip contents
        run: |
          set -e
          for ZIP in Zundamon-*.zip; do
            echo "== $ZIP =="
            unzip -l "$ZIP"
            unzip -l "$ZIP" | grep -qE ' Image$' || { echo "ERROR: Image missing in $ZIP"; exit 1; }
            unzip -l "$ZIP" | grep -q ' anykernel.sh$' || { echo "ERROR: anykernel.sh missing in $ZIP"; exit 1; }
            unzip -l "$ZIP" | grep -q ' tools/ak3-core.sh$' || { echo "ERROR: tools/ak3-core.sh missing in $ZIP"; exit 1; }
            if unzip -l "$ZIP" | grep -q ' KernelSU.apk$'; then
              echo "OK: KernelSU.apk bundled in $ZIP"
            else
              echo "WARNING: KernelSU.apk not bundled in $ZIP (manager download failed)"
            fi
            if unzip -l "$ZIP" | grep -q ' dtbo.img$'; then
              echo "WARNING: unexpected dtbo.img in $ZIP"
            else
              echo "OK: no dtbo.img shipped (keeps ROM dtbo intact)"
            fi
          done

      - name: Upload flashable zip
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.KNAME }}-${{ env.KLINE }}-${{ env.KV }}${{ matrix.variant == 'docker' && '-docker' || '' }}
          path: |
            Zundamon-*.zip
            Zundamon-*.zip.sha256
          if-no-files-found: error

      - name: Upload raw artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raphael-4.14-image${{ matrix.variant == 'docker' && '-docker' || '' }}
          path: artifacts/
          if-no-files-found: warn

      # Publish the failing log to a branch so it can be inspected without
      # authenticated artifact access.
      - name: Publish failure log to branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA  variant: ${{ matrix.variant }}"
            echo "=== configure (tail) ==="
            tail -40 out.configure.log 2>/dev/null
            echo "=== build: errors ==="
            grep -nE "error:|Error [0-9]|No rule to make|undefined reference|fatal error" out.build.log 2>/dev/null | tail -60
            echo "=== build (tail) ==="
            tail -120 out.build.log 2>/dev/null
          } > ci-build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-build-failure.log
          git commit -m "ci: build failure log (run $GITHUB_RUN_ID)" || true
          git push --force origin ci-logs

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download flashable zips (standard + docker)
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.KNAME }}-${{ env.KLINE }}-${{ env.KV }}*
          merge-multiple: true
          path: dist

      - name: Fetch KernelSU manager (backslashxx v3.3.1, build 32680)
        run: |
          curl -fsSL -o "dist/$KSU_MANAGER_ASSET" "$KSU_MANAGER_URL"
          ls -lh "dist/$KSU_MANAGER_ASSET"
          ls -lh dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.KV }}-4.14
        run: |
          set -o pipefail
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Zundamon 4.14.357 ${{ env.KV }} (raphael / K20 Pro)" \
            --prerelease \
            --notes "Zundamon kernel for Redmi K20 Pro (raphael), 4.14.357, ${{ env.KV }}.

          uname: 4.14.357-Zundamon-${{ env.KV }}

          - Zundamon-4.14.357-${{ env.KV }}.zip: AnyKernel3 flashable zip, standard flavour (Image only, keeps your ROM dtbo).
          - Zundamon-4.14.357-${{ env.KV }}-docker.zip: same kernel with Docker/container support (UTS/IPC/PID/NET/USER namespaces, cgroup pids/device, veth/bridge/vxlan + NAT, overlayfs, seccomp filters).
          - KernelSU-v3.3.1\_32680.apk: the matching manager (backslashxx/KernelSU build 32680, MINIMAL_SUPPORTED_KERNEL 32513, app-profile ABI v4). Install this one, then open it once and grant root.
          - Do not use KernelSU-Next 3.x managers: 3.1.0 uses app-profile ABI v2 and 3.2.0/3.4.x require kernel 33110/33188, so superuser profile edits fail with failed to update app profile.
          - Both zips' anykernel.sh copies the manager to /sdcard/Download/Zundamon/KernelSU.apk; install it after boot.

          Changes in v1.0-rc4: switched the bundled manager to backslashxx/KernelSU v3.3.1 build 32680 (exact kernel match) and updated the kernel certificate whitelist to it, so adding a superuser no longer fails with the app profile error.

          Backup boot/dtbo before flashing." \
            dist/*.zip dist/*.sha256 dist/*.apk 2>&1 | tee release.log

      - name: Publish release failure log to branch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo "run: $GITHUB_RUN_ID  commit: $GITHUB_SHA"; echo "=== release.log ==="; cat release.log 2>/dev/null; echo "=== dist ==="; ls -l dist 2>/dev/null; } > ci-build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f ci-build-failure.log
          git commit -m "ci: release failure log (run $GITHUB_RUN_ID)" || true
          git push --force origin ci-logs || true
